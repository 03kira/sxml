name: MDL Data Enrichment Worker

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Target Year to enrich (e.g. 2026, 2025, 2024)'
        required: true
        default: '2026'
      limit:
        description: 'Limit titles to scrape in this run (0 for all pending)'
        required: false
        default: '0'
      max_minutes:
        description: 'Safety timer in minutes before graceful commit (default 270 = 4.5 hours)'
        required: false
        default: '270'

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Probe Cloudflare Connectivity
        run: node src/probe.js

      - name: Run Deep Detail Enrichment
        run: |
          node src/enricher.js --year ${{ github.event.inputs.year || '2026' }} --limit ${{ github.event.inputs.limit || '0' }} --max-minutes ${{ github.event.inputs.max_minutes || '270' }}

      - name: Commit and Push Enriched JSON Data
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto-enrich: sync MDL dossiers for ${{ github.event.inputs.year || '2026' }} [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin HEAD:main || echo "Already up to date"

