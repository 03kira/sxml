name: MDL Data Enrichment Worker

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Target Year to enrich (e.g. 2026, 2025, 2024)'
        required: true
        default: '2026'
      limit:
        description: 'Limit titles to scrape in this run (0 for all pending)'
        required: false
        default: '0'
      max_minutes:
        description: 'Safety timer in minutes before graceful commit (default 270 = 4.5 hours)'
        required: false
        default: '270'

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Probe Cloudflare Connectivity
        run: node src/probe.js

      - name: Run Deep Detail Enrichment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node src/enricher.js --year ${{ github.event.inputs.year || '2026' }} --limit ${{ github.event.inputs.limit || '0' }} --max-minutes ${{ github.event.inputs.max_minutes || '270' }}

      - name: Commit and Push Enriched JSON Data
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-enrich: sync MDL dossiers for ${{ github.event.inputs.year || '2026' }} [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          else
            echo "No changes in data/ to commit"
          fi

      - name: Upload Enriched Data Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdl-enriched-${{ github.event.inputs.year || '2026' }}
          path: data/
          retention-days: 14

